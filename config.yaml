# Mac-local CaseNet tracker config.
#
# Bar number lives in a separate, .gitignored file (.bar_number) — see README.

attorney:
  name: "Corbin Healy"
  counties:
    - "Jackson"
  timezone: "America/Chicago"

notify:
  # Phone number or Apple ID email — where the morning iMessage goes. Leave
  # blank to skip iMessages.
  imessage_to: ""

calendar:
  # Master switch — set false to skip Apple Calendar sync.
  enabled: true
  # The Calendar.app calendar to sync into. Created automatically if missing.
  apple_calendar_name: "CaseNet"
  # Optional prefix for event titles.
  event_title_prefix: ""
  # How party names appear: full | initials | case_only
  party_display: "full"

dashboard:
  title: "Corbin's CaseNet Docket"
  upcoming_window_days: 30

scraper:
  # CaseNet's results endpoint. The scraper hits this with one GET per 7-day
  # window via Playwright (headless Chromium).
  base_url: "https://www.courts.mo.gov/casenet/calendarSearchResult.do"
  # 60 days covers your longest prep flag (trial 60 days out). CaseNet caps
  # each search at 7 days; we walk forward in 7-day chunks.
  forward_days: 60
  headless: true
  save_debug_artifacts_on_failure: true

git:
  # If true, after each successful run the script commits state/ + docs/ and
  # pushes to origin/main, which keeps your GitHub Pages dashboard up to date.
  # Set false if you don't want the daily auto-commits.
  auto_push: true
