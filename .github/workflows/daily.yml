# This workflow is intentionally disabled.
#
# casenet-tracker runs locally on the Mac via a LaunchAgent — see README.
# The cloud schedule was retired because Missouri CaseNet returns HTTP 403
# to GitHub Actions runner IPs (firewall-level block on cloud ranges).
#
# This file is kept (instead of deleted) so anyone who clones the repo can
# see why the cron no longer runs.

name: disabled-cloud-cron

on:
  workflow_dispatch: {}

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "casenet-tracker now runs locally on the user's Mac."
          echo "See README.md → 'How it runs'."
          exit 0
